name: build
on: [push, pull_request]
jobs:
  build:
    name: ghc ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ["9.0.1", "9.2.7", "9.6.5"]
        cabal: ["3.16.0.0"]
    env:
      CONFIG: "--enable-tests --enable-benchmarks"
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get install -y libsodium-dev
      - name: Setup Haskell
        id: setup-haskell-cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal v2-update
      - run: cabal v2-freeze $CONFIG
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-
      - run: cabal v2-build $CONFIG
      - run: cabal v2-test $CONFIG
      - run: cabal v2-haddock $CONFIG
      - run: cabal v2-sdist

  nix-build:
    name: Nix build (GHC 9.8.4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nixpkgs: ["25.05"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-${{ matrix.nixpkgs }}
      - name: Cache Nix state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/nix
            ~/.nix-profile
            ~/.local/share/nix
          key: ${{ runner.os }}-nix-${{ hashFiles('**/flake.lock','**/flake.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-
      - name: Build with Nix
        run: nix develop --command bash -c "cabal v2-build all"
      - name: Test, Haddock and sdist
        run: nix develop --command bash -c "cabal v2-test all"
      - name: Haddock
        run: nix develop --command bash -c "cabal v2-haddock all"
      - name: sdist
        run: nix develop --command bash -c "cabal v2-sdist"
