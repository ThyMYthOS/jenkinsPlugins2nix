name: build
on: [push, pull_request]
jobs:
  nix-build:
    name: Nix build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: ["nixos-25.05", "nixos-25.11"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:${{ matrix.channel }}
      - name: Cache Nix state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/nix
            ~/.nix-profile
            ~/.local/share/nix
          key: ${{ runner.os }}-nix-${{ hashFiles('**/flake.lock','**/flake.nix') }}
          restore-keys: |
            ${{ runner.os }}-nix-
      - name: Version info
        uses: ./.github/actions/nix-run
        with:
          command: "ghc --version && cabal --version"
          channel: ${{ matrix.channel }}
      - name: Build
        uses: ./.github/actions/nix-run
        with:
          command: "cabal v2-build all"
          channel: ${{ matrix.channel }}
      - name: Test
        uses: ./.github/actions/nix-run
        with:
          command: "cabal v2-test all"
          channel: ${{ matrix.channel }}
      - name: Haddock
        uses: ./.github/actions/nix-run
        with:
          command: "cabal v2-haddock all"
          channel: ${{ matrix.channel }}
      - name: Source distribution
        uses: ./.github/actions/nix-run
        with:
          command: "cabal v2-sdist"
          channel: ${{ matrix.channel }}
